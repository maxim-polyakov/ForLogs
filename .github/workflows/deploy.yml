name: Deploy monitoring stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: monitoring-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ENV_FILE: ${{ secrets.ENV_FILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "::error::SSH_HOST secret is required"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::SSH_USER secret is required"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY secret is required"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH secret is required"; exit 1; }
          test -n "$ENV_FILE" || { echo "::error::ENV_FILE secret is required"; exit 1; }

      - name: Prepare deployment files
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

          printf '%s\n' "$ENV_FILE" > .env.deploy

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.deploy' \
            -czf "$RUNNER_TEMP/deploy.tar.gz" .

      - name: Upload files
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT")
          SCP=(scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT")

          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          "${SCP[@]}" "$RUNNER_TEMP/deploy.tar.gz" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/deploy.tar.gz"
          "${SCP[@]}" .env.deploy "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/.env"

      - name: Start services
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && \
             tar -xzf deploy.tar.gz && \
             rm deploy.tar.gz && \
             chmod 600 .env && \
             docker compose pull && \
             sudo -n /usr/local/sbin/compose-k3s-sync \
               --project-dir '$DEPLOY_PATH' \
               --skip-build \
               --timeout 15m"
